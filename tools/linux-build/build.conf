# What makes a build THIS build. The single source for these values, read by
#
#   tools/linux-build/setup.sh   (sourced as shell)
#   config/CONFIG.Defs           (included as make, via setup.sh)
#   pwfs.spec                    (read with %(...) for Requires and %install)
#
# so a local `make` and the pipeline's rpmbuild cannot disagree about any of
# them. Plain KEY=value with no spaces, so that sh and make both parse it.

# Site whose #if (MK)/(CP) blocks compile in. MK and CP objects differ.
SITE=MK

# Where the crate boots this tree from. IOCPATH_HOST is only there because
# CONFIG_APPLIC splits APPLIC_IOCPATH on a colon; DEPLOY is the path the
# startup scripts cd into, and the path the RPM installs to.
IOCPATH_HOST=mkotcsbootv2-lv1
DEPLOY=/gemini/epics3.13.4/pwfs/pwfs

# Support-library versions. These drive the build's -d include paths, the
# literal `ld <` paths in the generated startup scripts (as macTest macros),
# and the RPM's Requires -- for vxWorks the copy on the file server IS the
# running code, so all three must name the same version.
SLALIB_VER=V1-9-4
TIMELIB_VER=V1-8-6
ASTLIB_VER=V1-4
CFITSIO_VER=V4-1
